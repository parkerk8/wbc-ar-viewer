<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cell Viewer</title>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: system-ui;
    }

    model-viewer {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      display: none;
      background: #111;
    }

    /* 🔥 portrait crash fix */
    @media (orientation: portrait) {
      model-viewer {
        height: 60dvh;
        max-height: 60dvh;
      }
    }

    #ar-button {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 20px;
      z-index: 9999;
      background: #fff;
      color: #4285f4;
      padding: 12px 24px;
      border-radius: 24px;
      border: none;
      font-size: 16px;
    }

    .hotspot {
      transform: translate(-50%, -50%);
    }

    .hotspot-label {
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 14px;
    }

    #error {
      position: fixed;
      bottom: 10px;
      left: 10px;
      right: 10px;
      color: white;
      background: rgba(150,0,0,0.8);
      padding: 8px;
      display: none;
    }
  </style>
</head>

<body>

<model-viewer
  id="viewer"
  camera-controls
  ar
  ar-modes="webxr quick-look"
  shadow-intensity="1"
>
  <button slot="ar-button" id="ar-button">View in your space</button>

  <!-- DEFAULT HOTSPOTS -->
  <button id="hs-nucleus" slot="hotspot-nucleus" class="hotspot" data-position="0 1 0">
    <div class="hotspot-label">Nucleus</div>
  </button>

  <button id="hs-golgi" slot="hotspot-golgi" class="hotspot" data-position="1 0 1">
    <div class="hotspot-label">Golgi</div>
  </button>

</model-viewer>

<div id="error"></div>

<script>
window.addEventListener("DOMContentLoaded", () => {

  /* 🔥 force lower render resolution (critical for iPhone) */
  customElements.whenDefined('model-viewer').then(() => {
    const MV = customElements.get('model-viewer');
    MV.minimumRenderScale = 0.2;
    MV.maximumRenderScale = 0.5;
  });

  const viewer = document.getElementById("viewer");
  const errorBox = document.getElementById("error");

  const MODELS = {
    default: "./default.glb",
    neutrophil: "./neutrophil.glb",
    basophil: "./basophil.glb",
    eosinophil: "./eosinophil.glb",
    monocyte: "./monocyte.glb",
    lymphocyte: "./lymphocyte.glb"
  };

  function getModelFromURL() {
    const url = new URL(window.location.href);
    return (url.searchParams.get("model") || "default").toLowerCase();
  }

  function setError(msg) {
    if (!msg) {
      errorBox.style.display = "none";
      return;
    }
    errorBox.style.display = "block";
    errorBox.textContent = msg;
  }

  function loadModel(key) {
    const src = MODELS[key] || MODELS.default;

    viewer.style.display = "block";
    viewer.removeAttribute("ios-src");
    viewer.setAttribute("src", src);

    viewer.addEventListener("load", () => {
      setError(null);
    }, { once: true });

    viewer.addEventListener("error", () => {
      setError("Failed to load model: " + key);
    }, { once: true });
  }

  /* 🔥 orientation crash fix */
  let resizeTimeout = null;

  function refreshViewer() {
    const current = viewer.getAttribute("src");
    viewer.removeAttribute("src");

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        viewer.setAttribute("src", current);
      });
    });
  }

  window.addEventListener("orientationchange", () => {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(refreshViewer, 250);
  });

  window.addEventListener("resize", () => {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(refreshViewer, 250);
  });

  /* 🚀 INIT */
  const modelKey = getModelFromURL();
  loadModel(modelKey);

});
</script>

</body>
</html>
